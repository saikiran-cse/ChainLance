# All secrets come from environment variables (see backend/.env.example). Nothing secret is stored in this file.
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: chainlance-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chainlance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:chainlance}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

chainlance:
  jwt:
    secret: ${JWT_SECRET:}                 # at least 32 characters; generate a random one
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin-bootstrap:
    email: ${ADMIN_EMAIL:}                 # if set, an ADMIN user is created on first start
    password: ${ADMIN_PASSWORD:}
  chain:
    chain-id: ${CHAIN_ID:11155111}         # Sepolia. Use 31337 only for local Hardhat testing.
    rpc-url: ${SEPOLIA_RPC_URL:}           # server-side read-only RPC; never sent to the browser
    factory-address: ${FACTORY_ADDRESS:}
    admin-address: ${ADMIN_WALLET_ADDRESS:}
    required-confirmations: ${REQUIRED_CONFIRMATIONS:1}
  wallet:
    challenge-ttl-minutes: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
